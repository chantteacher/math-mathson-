<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mathson">
</head>
<body>
<title>매일 꾸준히 mathson</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="하루 7문제, 365일 — 스스로 풀고 해설과 개념 정리로 마무리하는 수능 수학 학습 도우미">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 상단 남색 바 + 가운데 1000px 작업 영역. 문제지·개념지는 흰 종이(테마와 무관) */
:root{
  --brand:#14213d; --brand-2:#24365e; --gold:#f2b134; --gold-ink:#5a3d00;
  --bg:#f5f3ec; --card:#ffffff; --fg:#14213d; --muted:#6b7385; --line:#e3e0d6; --soft:#efece4;
  --ok:#2f7a3c; --no:#c2412d; --warn:#b26a00; --warn-bg:#fff1dc; --ok-bg:#e4f2e6;
  --h1:#e1eed8; --h2:#bcdba6; --h3:#8bc177; --h4:#559f51; --h5:#2e7a3b; --miss:#e8e5dc;
  --l1:#e6eae2; --l2:#cbd4c4; --l3:#a5b39d; --l4:#7f8f78; --l5:#5f6d59;
  --paper:#ffffff; --paper-ink:#111111; --paper-line:#dddddd; --note:#fbf6e6;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 16px rgba(20,33,61,.06);
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Batang","AppleMyungjo",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --card:#18213a; --fg:#e8ecf5; --muted:#9aa5bd; --line:#2a3553; --soft:#212c48;
  --warn-bg:#3a2a10; --ok-bg:#16301d; --miss:#2a3350;
  --h1:#26402b; --h2:#2f5a36; --h3:#3f7d45; --h4:#5aa55a; --h5:#86cf7a;
  --l1:#2b3530; --l2:#38463c; --l3:#4d5f51; --l4:#6c7f6d; --l5:#93a493;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --card:#18213a; --fg:#e8ecf5; --muted:#9aa5bd; --line:#2a3553; --soft:#212c48;
  --warn-bg:#3a2a10; --ok-bg:#16301d; --miss:#2a3350;
  --h1:#26402b; --h2:#2f5a36; --h3:#3f7d45; --h4:#5aa55a; --h5:#86cf7a;
  --l1:#2b3530; --l2:#38463c; --l3:#4d5f51; --l4:#6c7f6d; --l5:#93a493;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit} button{font:inherit;cursor:pointer;color:inherit} input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.center{display:grid;place-items:center;min-height:60vh;text-align:center;padding-block:16px}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2,h3{text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:9px 15px;font-weight:700;text-decoration:none;background:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:#fff} .btn.primary:hover{background:var(--brand-2)}
:root[data-theme="dark"] .btn.primary{background:var(--gold);color:var(--gold-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);color:var(--gold-ink)}}
.btn.ghost{border-color:var(--line);background:var(--card)} .btn.ghost:hover{border-color:var(--muted)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.sm{padding:6px 11px;font-size:14px} .btn.lg{padding:13px 22px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--brand);color:#fff}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;white-space:nowrap;background:none;border:0;color:#fff;padding:0}
.brand b{color:var(--gold);font-weight:900}
.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--gold);color:var(--brand);font-family:var(--serif);font-size:20px;font-weight:900}
.topbar nav{display:flex;gap:4px;align-items:center;overflow-x:auto;min-width:0}
.nav.inst{color:var(--brand);background:var(--gold);font-weight:700}
.nav[hidden]{display:none}
.nav{color:#c9d1e3;padding:6px 10px;border-radius:8px;font-size:14px;white-space:nowrap;background:none;border:0}
.nav.on{color:#fff;background:rgba(255,255,255,.13)}
.banner{font-size:13px;padding:6px 16px;text-align:center;background:var(--warn-bg);color:var(--warn)}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:16px}
.login{min-height:92vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:440px;text-align:center;padding:34px 26px}
.login-logo{width:64px;height:64px;margin:0 auto 12px;border-radius:16px;background:var(--brand);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:40px;font-weight:900}
.login h1{margin:0;font-size:30px} .login h1 b{background:linear-gradient(transparent 62%,var(--gold) 62%);color:inherit}
.steps{list-style:none;padding:0;margin:18px 0 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps li{background:var(--soft);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;gap:4px}
.steps b{font-family:var(--serif);font-size:20px;font-weight:900} .steps span{font-size:12px;color:var(--muted);line-height:1.35}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.hello h2{margin:0;font-size:22px;line-height:1.45}
.hello .colon{color:var(--muted);font-weight:400;margin:0 2px}
.hello .quote{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--fg)}
.hello .quote small{font-family:inherit;font-size:13px;font-weight:400;color:var(--muted);white-space:nowrap}
.today{position:relative;overflow:hidden;background:var(--brand);color:#fff;border-radius:18px;padding:22px 22px 28px;margin-bottom:16px}
.today .sub{color:#b4bfd6}
.today-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.flow span{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:#c9d1e3}
.flow span.done{background:var(--gold);color:var(--gold-ink);font-weight:700}
.today.done{background:linear-gradient(135deg,#1f4f37,#2f7a3c)} .today.done .sub{color:#d3eadb}
.eyebrow{font-size:13px;opacity:.85}
.big{font-family:var(--serif);font-size:32px;font-weight:900;line-height:1.2;margin:2px 0}
.big small{font-size:18px;opacity:.7}
.progress{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.14)} .progress span{display:block;height:100%;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;min-width:0}
.stat .k{font-size:13px;color:var(--muted)} .stat .v{font-family:var(--serif);font-size:28px;font-weight:900;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--muted);font-family:var(--sans);font-weight:500} .stat .v.sm{font-size:19px;padding:5px 0}
.stat .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-bottom:16px} .grid2>.card{margin-bottom:0}
.cal-nav{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.cal-nav button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:30px;height:30px;font-size:18px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{text-align:center;font-size:12px;color:var(--muted)} .cal-w.sun{color:var(--no)}
.cal-d{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:9px;background:var(--soft);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;min-width:0;padding:0}
.cal-d .sc{font-size:11px;font-weight:700;margin-top:2px}
.cal-d .fin{position:absolute;top:2px;right:4px;font-size:10px;color:var(--gold)}
.cal-d.out{visibility:hidden} .cal-d.future{color:var(--muted);opacity:.6}
.cal-d.miss{background:var(--miss);color:var(--muted);background-image:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(127,127,127,.08) 5px 7px)}
.h1{background:var(--h1)!important} .h2{background:var(--h2)!important} .h3{background:var(--h3)!important;color:#fff} .h4{background:var(--h4)!important;color:#fff} .h5{background:var(--h5)!important;color:#fff}
.h1.late{background:var(--l1)!important} .h2.late{background:var(--l2)!important} .h3.late{background:var(--l3)!important} .h4.late{background:var(--l4)!important} .h5.late{background:var(--l5)!important}
.legend i.late{background:var(--l3)}
.cal-d.today{outline:2px solid var(--gold);outline-offset:1px}
button.cal-d:hover{filter:brightness(.95)}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.miss{background:var(--miss);margin-left:8px}
.heat-scroll{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px;width:max-content}
.heat>*{width:12px;height:12px;border-radius:3px;background:var(--soft);display:block;border:0;padding:0}
.heat>.blank{background:transparent} .heat .miss{background:var(--miss)} .heat .todayc{outline:2px solid var(--gold)}
.bar-row{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr) 54px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.bar-row .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .bar-row .bv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar{display:block;height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--h4);border-radius:6px} .bar.low i{background:var(--no)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.scope-btns{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{flex:1 1 0;min-width:0;white-space:nowrap;padding:12px 6px;letter-spacing:-.2px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.sbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .sbtn.on{background:var(--gold);border-color:var(--gold);color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sbtn.on{background:var(--gold);border-color:var(--gold);color:var(--brand)}}
.chip{border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;background:var(--card)}
button.chip{cursor:pointer;color:var(--fg);font:inherit;font-size:13px}
.tchip b{color:var(--no);margin-left:2px}
.tchip.on{background:var(--brand);border-color:var(--brand);color:#fff}.tchip.on b{color:var(--gold)}
.wsum{margin:4px 2px 10px;scroll-margin-top:64px}
button.chip.more{color:var(--muted);border-style:dashed}.wconcept{margin-bottom:16px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--soft);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.linkish{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.solvebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line)}
.sb{display:flex;align-items:center;gap:8px;min-width:0}
.clock{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--soft);padding:3px 8px;border-radius:6px}
/* 문제지 */
.sheet-wrap{max-width:900px}
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:var(--shadow);padding:28px 28px 20px;font-family:var(--serif);color-scheme:light}
.sheet-head{border-bottom:3px double var(--paper-ink);padding-bottom:10px;margin-bottom:16px}
.sh-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#444;font-family:var(--sans);flex-wrap:wrap}
.sh-title{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:6px 0}
.sh-title h1{margin:0;font-size:32px;font-weight:900;letter-spacing:6px;padding:3px 22px;border:2px solid var(--paper-ink);border-radius:30px}
.sh-side{font-size:14px;font-weight:700} .sh-side.r{text-align:right}
.sh-meta{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:13px;font-family:var(--sans)}
.sh-meta u{text-decoration:none;border-bottom:1px solid var(--paper-ink);padding:0 16px;font-weight:700}
.cols{column-count:1}
@media (min-width:820px){.cols{column-count:2;column-gap:28px;column-rule:1px solid var(--paper-ink)}}
.prob{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px;break-inside:avoid;padding:14px 4px 18px;border-bottom:1px dashed var(--paper-line)}
.prob:last-child{border-bottom:0}
.pnum{font-weight:900;font-size:18px;line-height:1.5}
.stem{font-size:16px;line-height:1.9;word-break:keep-all;overflow-wrap:anywhere}
.stem .cond{border:1px solid var(--paper-ink);padding:6px 12px;margin:8px 0;line-height:1.9}
.pts{font-size:13px;white-space:nowrap}
.choices{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:10px;font-size:15px}
.choices span{min-width:64px}
.src{font-family:var(--sans);font-size:11px;color:#8a8a8a;margin-top:8px}
.answer{font-family:var(--sans);margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{width:44px;height:44px;border-radius:50%;border:1.5px solid #cfccc3;background:#fff;color:#333;font-size:20px;display:grid;place-items:center;padding:0}
.opt:hover:not(:disabled){border-color:#14213d}
.opt.sel{background:#14213d;border-color:#14213d;color:#fff}
.opt.key{box-shadow:0 0 0 3px #2f7a3c}
.short{display:flex;align-items:center;gap:8px}
.short input{width:150px;border:1.5px solid #cfccc3;border-radius:10px;padding:10px 12px;font-size:18px;font-weight:700;letter-spacing:2px;background:#fff;color:#111}
.keyval{font-weight:700;color:#2f7a3c;font-size:14px}
.ptime{font-size:12px;color:#888;margin-left:auto}
.mark{position:absolute;left:-8px;top:2px;font-size:44px;line-height:1;font-weight:900;pointer-events:none;font-family:var(--sans)}
.mark.ok{color:rgba(47,122,60,.7)} .mark.no{color:rgba(194,65,45,.7)}
.prob.is-no .short input{border-color:#c2412d;color:#c2412d}
.sheet-foot{border-top:1px solid var(--paper-ink);margin-top:10px;padding-top:6px;font-size:11px;color:#666;text-align:center;font-family:var(--sans)}
/* 해설 */
.sol{margin-top:12px;border-top:1px solid var(--paper-line);padding-top:10px;font-family:var(--sans)}
.sol summary{cursor:pointer;font-weight:700;font-size:14px;color:#14213d;list-style:none;display:flex;align-items:center;gap:6px}
.sol summary::-webkit-details-marker{display:none}
.sol summary::before{content:"▸";transition:transform .15s} .sol[open] summary::before{transform:rotate(90deg)}
.sol-body{font-size:14.5px;line-height:1.95;margin-top:8px;padding:10px 12px;background:#f7f6f1;border-radius:8px;color:#222;overflow-wrap:anywhere}
.result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.rc-grid{display:flex;gap:18px;flex-wrap:wrap} .rc-grid span{display:block;font-size:12px;color:var(--muted)} .rc-grid b{font-size:15px}
.rc-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.next-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--brand);color:#fff;border-radius:16px;padding:18px 20px;margin-top:16px}
.next-card .sub{color:#b4bfd6;font-size:14px}
/* 개념 정리 한 장 */
.cpage{background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:var(--shadow);padding:26px 28px;font-family:var(--sans);color-scheme:light}
.cpage-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:3px double #111;padding-bottom:10px;margin-bottom:16px;flex-wrap:wrap}
.cpage-head h1{margin:0;font-family:var(--serif);font-size:26px;font-weight:900}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ccard{border:1px solid #d9d5c8;border-radius:10px;padding:12px 14px;break-inside:avoid;background:#fff}
.ccard h3{margin:0 0 6px;font-family:var(--serif);font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ccard h3 small{font-family:var(--sans);font-size:11px;color:#8a7a50;font-weight:700;white-space:nowrap}
.ccard ul{margin:0;padding-left:18px;font-size:14px;line-height:1.9}
.ccard.weak{border-color:#c2412d;box-shadow:inset 3px 0 0 #c2412d}
.recap{margin-top:14px;padding:10px 14px;background:#f7f6f1;border-radius:10px;font-size:14px;line-height:1.8}
.finish{text-align:center;margin-top:18px}
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;border:4px solid var(--gold);color:var(--gold);font-family:var(--serif);font-weight:900;transform:rotate(-8deg);margin:8px auto}
.stamp b{font-size:28px} .stamp span{font-size:12px}
.wrong-item{border-bottom:1px solid var(--line);padding:12px 0}
.wrong-item:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;transition:.25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

async function firebaseBackend() {
  const base = "https://www.gstatic.com/firebasejs/10.12.2";
  const { initializeApp } = await import(`${base}/firebase-app.js`);
  const A = await import(`${base}/firebase-auth.js`);
  const F = await import(`${base}/firebase-firestore.js`);
  const app = initializeApp(CONFIG.firebase);
  const auth = A.getAuth(app), db = F.getFirestore(app);
  await A.setPersistence(auth, A.browserLocalPersistence).catch(() => {});   // 한 번 로그인하면 이 기기에서 계속 로그인 유지
  let fresh = lsGet("mathson_just_signed_in", false);
  try { const rr = await A.getRedirectResult(auth); if (rr && rr.user) fresh = true; } catch {}
  const u = await new Promise((r) => { const off = A.onAuthStateChanged(auth, (x) => { off(); r(x); }); });
  if (u && CONFIG.allowedDomain && !(u.email || "").endsWith("@" + CONFIG.allowedDomain)) { await A.signOut(auth); toast(`${CONFIG.allowedDomain} 계정으로만 로그인할 수 있어요.`); }
  const ok = u && (!CONFIG.allowedDomain || (u.email || "").endsWith("@" + CONFIG.allowedDomain));
  // ── 한 계정은 한 기기에서만: 새 기기에서 로그인하면 이전 기기는 자동 로그아웃 ──
  let cached = null;
  if (!ok) lsSet("mathson_just_signed_in", false);
  if (ok) {
    const ref = F.doc(db, "users", u.uid);
    const kick = async () => { lsSet("mathson_kicked", true); lsSet("mathson_choose_account", false); await A.signOut(auth).catch(() => {}); location.reload(); };
    if (fresh) {
      await F.setDoc(ref, { activeDevice: DEVICE_ID, activeAt: Date.now() }, { merge: true });
      lsSet("mathson_just_signed_in", false);
    } else {
      const snap = await F.getDoc(ref);
      const ad = snap.exists() ? snap.data().activeDevice : null;
      if (ad && ad !== DEVICE_ID) { await kick(); return new Promise(() => {}); }
      if (!ad) await F.setDoc(ref, { activeDevice: DEVICE_ID, activeAt: Date.now() }, { merge: true });
      cached = snap.exists() ? snap.data() : null;
    }
    F.onSnapshot(ref, (snap) => { const ad = snap.exists() ? snap.data().activeDevice : null; if (ad && ad !== DEVICE_ID) kick(); }, () => {});
  }
  return {
    mode: "firebase", needsSignIn: !ok, note: "",
    user: ok ? { uid: u.uid, name: u.displayName || "", email: u.email || "" } : null,
    async signIn() {
      const p = new A.GoogleAuthProvider(); const choose = lsGet("mathson_choose_account", false); p.setCustomParameters({ ...(choose ? { prompt: "select_account" } : {}), ...(CONFIG.allowedDomain ? { hd: CONFIG.allowedDomain } : {}) });
      lsSet("mathson_just_signed_in", true);
      try { await A.signInWithPopup(auth, p); lsSet("mathson_choose_account", false); } catch (e) { if (/popup/.test(e.code || "")) return A.signInWithRedirect(auth, p); lsSet("mathson_just_signed_in", false); throw e; }
      location.reload();
    },
    async signOut() { lsSet("mathson_choose_account", true); await A.signOut(auth); location.reload(); },
    async load() { if (cached) { const c = cached; cached = null; return { days: {}, ...c }; } const s = await F.getDoc(F.doc(db, "users", u.uid)); return s.exists() ? { days: {}, ...s.data() } : { days: {} }; },
    async saveDay(dk, d) { await F.setDoc(F.doc(db, "users", u.uid), { days: { [dk]: d }, name: u.displayName || "", updatedAt: Date.now() }, { merge: true }); },
    async saveSel(sel) { await F.setDoc(F.doc(db, "users", u.uid), { sel }, { merge: true }); },
    async getMemo(dk) { const s = await F.getDoc(F.doc(db, "users", u.uid, "memos", dk)); return s.exists() ? s.data() : {}; },
    async saveMemo(dk, m) { await F.setDoc(F.doc(db, "users", u.uid, "memos", dk), m); },
  };
}

function myStats() {
  const days = Object.values(S.rec.days);
  const q = days.reduce((s, d) => s + d.correct.length, 0), c = days.reduce((s, d) => s + d.score, 0);
  const t = Math.min(todayNo(), TOTAL); let streak = 0;
  for (let n = S.rec.days[dayKey(t)] ? t : t - 1; n >= 1; n--) { const d = S.rec.days[dayKey(n)]; if (d && !d.late) streak++; else break; }
  const unit = {}, lev = {}; UNITS.forEach((u) => (unit[u] = { c: 0, n: 0 })); LEVELS.forEach((l) => (lev[l] = { c: 0, n: 0 }));
  days.forEach((d) => d.correct.forEach((ok, i) => { const u = d.units && d.units[i], l = d.levels && d.levels[i]; if (unit[u]) { unit[u].n++; unit[u].c += ok ? 1 : 0; } if (lev[l]) { lev[l].n++; lev[l].c += ok ? 1 : 0; } }));
  const wrong = days.reduce((s, d) => s + d.correct.filter((x) => !x).length, 0);

/* ============================== 문제지 ============================== */
function problemHTML(p, i, o = {}) {
  const ans = o.answers ? o.answers[i] : null, isRes = o.mode === "result", right = o.correct ? o.correct[i] : null;
  const key = isRes ? p.answer : null;
  let ui = "";
  if (o.mode === "solve" || isRes) {
    ui = p.type === "mc"
      ? `<div class="opts">${[1, 2, 3, 4, 5].map((v) => `<button type="button" class="opt ${ans === v ? "sel" : ""} ${key === v ? "key" : ""}" data-i="${i}" data-v="${v}" ${isRes ? "disabled" : ""} aria-label="${v}번">${CIRC[v - 1]}</button>`).join("")}</div>`
      : `<div class="short"><input id="ans-${i}" type="text" inputmode="numeric" maxlength="3" data-i="${i}" placeholder="답 (0~999)" value="${ans ?? ""}" ${isRes ? "disabled" : ""} aria-label="${i + 1}번 답">${isRes ? `<span class="keyval">정답 ${p.answer}</span>` : ""}</div>`;
    if (isRes && o.perMs) ui += `<span class="ptime">${fmtDur(o.perMs[i])}</span>`;
  }
  const mark = right != null ? `<span class="mark ${right ? "ok" : "no"}">${right ? "○" : "✕"}</span>` : "";
  const body = `<div class="stem">${p.stem} <span class="pts">[${p.points}점]</span></div>` + (p.choices ? `<div class="choices">${p.choices.map((c, k) => `<span>${CIRC[k]} ${c}</span>`).join("")}</div>` : "");
  const extra = isRes ? `<details class="sol" ${right ? "" : "open"}><summary>해설 보기</summary><div class="sol-body">${p.solution}</div></details>` : "";
  return `<article class="prob ${right === true ? "is-ok" : right === false ? "is-no" : ""}" data-i="${i}">${mark}<div class="pnum">${i + 1}.</div>
  <div class="pbody">${body}${ui ? `<div class="answer">${ui}</div>` : ""}${extra}</div></article>`;
}
function sheetHead(n) {
  return `<header class="sheet-head"><div class="sh-top"><span>대학수학능력시험 대비 · 일일 모의고사</span><span>Day ${n} · ${fmtDot(dateOfDay(n))}</span></div>
  <div class="sh-title"><span class="sh-side">제 ${n} 회</span><h1>수학 영역</h1><span class="sh-side r">매일 꾸준히 mathson</span></div>
  <div class="sh-meta"><span>성명 <u>${esc(S.user.name || "")}</u></span><span>7문항 · 하 2 · 중 3 · 상 2</span></div></header>`;
}
function sheetHTML(n, probs, o) {
  return `<div class="sheet" id="sheet">${sheetHead(n)}<div class="cols">${probs.map((p, i) => problemHTML(p, i, o)).join("")}</div>
  <footer class="sheet-foot">매일 꾸준히 mathson 자체 제작 문항</footer></div>`;
}

/* ---------- PDF ---------- */
async function pdfLibs() { await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"), loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]); }
async function makeSheetPdf(n, probs, filename) {
  toast("PDF를 만드는 중이에요…");
  try {
    await pdfLibs();
    const stage = document.getElementById("pdfStage");
    stage.innerHTML = `<div class="pdf-page" style="--hh:0px">${sheetHead(n)}<div class="pdf-cols"><div class="pdf-col" id="pmc"></div><div class="pdf-col"></div></div></div>`;
    const colW = document.getElementById("pmc").clientWidth, headH = stage.querySelector(".sheet-head").offsetHeight + 16;
    const meas = document.createElement("div"); meas.className = "pdf-page"; meas.style.cssText = `width:${colW}px;height:auto;padding:0`;
    meas.innerHTML = probs.map((p, i) => problemHTML(p, i, { mode: "print" })).join("");
    stage.innerHTML = ""; stage.appendChild(meas); await typeset(meas); if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const blocks = [...meas.children].map((el) => ({ el, h: el.offsetHeight })), inner = 1123 - 40 - 34 - 26;
    const pages = []; let cur; const np = (first) => { cur = { first, cols: [[], []], used: [0, 0], cap: inner - (first ? headH : 0), c: 0 }; pages.push(cur); }; np(true);
    for (const b of blocks) { const need = b.h + 110; if (cur.used[cur.c] + need > cur.cap && cur.used[cur.c] > 0) { if (cur.c === 0) cur.c = 1; else np(false); } cur.cols[cur.c].push(b.el); cur.used[cur.c] += need; }
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    for (let pi = 0; pi < pages.length; pi++) {
      const pg = pages[pi], el = document.createElement("div"); el.className = "pdf-page"; el.style.setProperty("--hh", (pg.first ? headH : 0) + "px");
      el.innerHTML = `${pg.first ? sheetHead(n) : ""}<div class="pdf-cols"><div class="pdf-col"></div><div class="pdf-col"></div></div><div class="pfoot"><span>매일 꾸준히 mathson · Day ${n}</span><span>${pi + 1} / ${pages.length}</span></div>`;
      const cols = el.querySelectorAll(".pdf-col"); pg.cols.forEach((list, ci) => list.forEach((b) => { b.style.marginBottom = "110px"; cols[ci].appendChild(b); }));
      stage.appendChild(el);
      const cv = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff", logging: false });
      if (pi) pdf.addPage(); pdf.addImage(cv.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, 297); stage.removeChild(el);
    }
    stage.innerHTML = ""; await saveFile(filename, pdf.output("blob"));
  } catch (e) { console.error(e); toast("PDF를 만들지 못했어요: " + e.message); }
}
async function elementToPdf(el, filename) {
  toast("PDF를 만드는 중이에요…");
  try {
    await pdfLibs();
    const stage = document.getElementById("pdfStage"), clone = el.cloneNode(true);
    clone.style.width = "794px"; clone.style.boxShadow = "none"; clone.style.borderRadius = "0";
    clone.querySelectorAll(".no-pdf").forEach((x) => x.remove());
    stage.innerHTML = ""; stage.appendChild(clone);
    const cv = await html2canvas(clone, { scale: 2, backgroundColor: "#ffffff", logging: false });
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    const pageH = Math.floor(cv.width * 297 / 210);
    for (let y = 0, i = 0; y < cv.height; y += pageH, i++) {
      const part = document.createElement("canvas"); part.width = cv.width; part.height = Math.min(pageH, cv.height - y);
      part.getContext("2d").drawImage(cv, 0, y, cv.width, part.height, 0, 0, cv.width, part.height);
      if (i) pdf.addPage(); pdf.addImage(part.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, part.height * 210 / cv.width);
    }
    stage.innerHTML = ""; await saveFile(filename, pdf.output("blob"));
  } catch (e) { console.error(e); toast("PDF를 만들지 못했어요: " + e.message); }
}

/* ============================== 풀이 ============================== */
async function viewDay(n) {
  if (!(n >= 1 && n <= TOTAL)) return go("home");
  if (n > todayNo()) { toast("아직 열리지 않은 날이에요."); return go("home"); }
  $app.innerHTML = `${topbar()}<div class="center muted">Day ${n} 문제를 불러오는 중…</div>`; bindTop();
  let probs; try { probs = await loadDay(n); } catch (e) { $app.querySelector(".center").textContent = "문제를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."; return; }
  if (!probs.length) { toast("문제가 없어요."); return go("home"); }
  const r = S.rec.days[dayKey(n)];
  if (r) return viewResult(n, probs, r);
  viewSolve(n, probs);
}
function stopSession() { const s = S.sess; if (!s) return; clearInterval(s.timer); ["blur", "focus", "pagehide"].forEach((ev) => window.removeEventListener(ev, s.tick)); document.removeEventListener("visibilitychange", s.tick); s.obs && s.obs.disconnect(); S.sess = null; }
function viewSolve(n, probs) {
  const key = `mathson_sess_${S.user.uid}_${dayKey(n)}`, ids = probs.map((p) => p.id);
  let ss = lsGet(key, null); const now = Date.now();
  if (!ss || JSON.stringify(ss.ids) !== JSON.stringify(ids)) ss = { ids, startedAt: now, lastTick: now, present: true, activeMs: 0, awayMs: 0, awayCount: 0, perMs: ids.map(() => 0), active: 0, answers: ids.map(() => null) };
  else { const gap = now - ss.lastTick; if (gap > 3000) { ss.awayMs += gap; ss.awayCount++; } ss.lastTick = now; ss.present = true; }
  lsSet(key, ss);
  $app.innerHTML = `${topbar()}<div class="solvebar"><div class="sb"><b>Day ${n}</b>${n < todayNo() ? `<span class="tag warn">지난 날짜 · 늦게 푼 날로 기록</span>` : ""}<span class="clock" id="clock">00:00</span></div>
  <div class="sb"><span class="muted small" id="prog"></span></div><div class="sb"><button class="btn ghost sm" id="pdfBtn">PDF</button><button class="btn primary sm" id="submitBtn">제출</button></div></div>
  <main class="wrap sheet-wrap"><p class="muted small" style="margin:4px 0 12px">연습장에 직접 풀고 답을 고르세요. 제출하면 바로 채점되고 해설이 열려요.</p>${sheetHTML(n, probs, { mode: "solve", answers: ss.answers })}</main>`;
  bindTop();
  const sheet = document.getElementById("sheet"); typeset(sheet);
  const prog = () => { const el = document.getElementById("prog"); if (el) el.textContent = `${ss.answers.filter((x) => x != null).length} / ${ids.length} 답함`; }; prog();
  sheet.addEventListener("click", (e) => {
    const c = e.target.closest(".prob"); if (c) ss.active = Number(c.dataset.i);
    const b = e.target.closest(".opt"); if (!b || b.disabled) return;
    const i = Number(b.dataset.i), v = Number(b.dataset.v); ss.answers[i] = ss.answers[i] === v ? null : v;
    sheet.querySelectorAll(`.opt[data-i="${i}"]`).forEach((x) => x.classList.toggle("sel", Number(x.dataset.v) === ss.answers[i])); lsSet(key, ss); prog();
  });
  sheet.addEventListener("input", (e) => { const inp = e.target.closest("input[data-i]"); if (!inp) return; inp.value = inp.value.replace(/\D/g, "").slice(0, 3); const i = Number(inp.dataset.i); ss.answers[i] = inp.value === "" ? null : Number(inp.value); ss.active = i; lsSet(key, ss); prog(); });
  const vis = new Map();
  const obs = new IntersectionObserver((ents) => { ents.forEach((en) => vis.set(Number(en.target.dataset.i), en.intersectionRatio)); let best = ss.active, br = -1; vis.forEach((r, i) => { if (r > br) { br = r; best = i; } }); if (br > 0.15) ss.active = best; }, { threshold: [0, 0.25, 0.5, 0.75, 1] });
  sheet.querySelectorAll(".prob").forEach((el) => obs.observe(el));
  const tick = () => {
    const t = Date.now(), dt = Math.min(t - ss.lastTick, 3600000); ss.lastTick = t;
    if (ss.present) { ss.activeMs += dt; ss.perMs[ss.active] = (ss.perMs[ss.active] || 0) + dt; } else ss.awayMs += dt;
    const np = !document.hidden && document.hasFocus(); if (ss.present && !np) ss.awayCount++; ss.present = np; lsSet(key, ss);
    const c = document.getElementById("clock"); if (c) c.textContent = fmtClock(ss.activeMs);
  };
  S.sess = { timer: setInterval(tick, 1000), tick, obs };
  ["blur", "focus", "pagehide"].forEach((ev) => window.addEventListener(ev, tick)); document.addEventListener("visibilitychange", tick);
  document.getElementById("pdfBtn").onclick = () => makeSheetPdf(n, probs, `mathson_day${dayKey(n)}.pdf`);
  document.getElementById("submitBtn").onclick = async () => {
    tick();
    const empty = ss.answers.map((x, i) => (x == null ? i + 1 : null)).filter(Boolean);
    if (!(await ask(empty.length ? `${empty.join(", ")}번에 답이 없어요. 그래도 제출할까요?` : "제출하면 바로 채점하고 해설을 보여 줘요. 제출할까요?", "제출"))) return;
    tick(); const end = Date.now();
    const correct = probs.map((p, i) => ss.answers[i] != null && Number(ss.answers[i]) === Number(p.answer));
    const d = { answers: ss.answers.map((x) => (x == null ? null : Number(x))), correct, score: correct.filter(Boolean).length,
      units: probs.map((p) => p.unit), levels: probs.map((p) => p.level), topics: probs.map((p) => p.topic), ids,
      activeMs: Math.round(ss.activeMs), awayMs: Math.round(ss.awayMs), awayCount: ss.awayCount, perMs: ss.perMs.map((x) => Math.round(x)),
      startedAt: ss.startedAt, submittedAt: end, late: n < todayNo(), finished: false };
    S.rec.days[dayKey(n)] = d; stopSession(); lsDel(key);
    try { await S.be.saveDay(dayKey(n), d); } catch (e) { console.warn(e); toast("기록 저장이 늦어지고 있어요. 잠시 후 자동으로 다시 저장할게요."); retrySave(dayKey(n)); }
    viewResult(n, probs, d, true);
  };
}
function retrySave(dk, tries = 0) { setTimeout(async () => { try { await S.be.saveDay(dk, S.rec.days[dk]); toast("기록을 저장했어요."); } catch { if (tries < 5) retrySave(dk, tries + 1); } }, 4000 * (tries + 1)); }

/* ============================== 채점·해설 ============================== */

/* ============================== 개념 정리 한 장 ============================== */
async function viewConcepts(n) {
  const r = S.rec.days[dayKey(n)];
  if (!r) { toast("먼저 문제를 풀고 제출해 주세요."); return go("solve", n); }
  $app.innerHTML = `${topbar()}<div class="center muted">개념 정리를 불러오는 중…</div>`; bindTop();
  let probs, C;

  const topics = []; probs.forEach((p, i) => { let t = topics.find((x) => x.key === p.topic); if (!t) topics.push((t = { key: p.topic, nums: [], wrong: false })); t.nums.push(i + 1); if (!r.correct[i]) t.wrong = true; });
  topics.sort((a, b) => b.wrong - a.wrong);

  $app.innerHTML = `${topbar()}<main class="wrap sheet-wrap">
  <article class="cpage" id="cpage"><header class="cpage-head"><div><div class="small" style="color:#555">Day ${n} · ${fmtDot(dateOfDay(n))} · 매일 꾸준히 mathson</div><h1>오늘의 개념 정리</h1></div>

    <div class="cgrid">${topics.map((t) => { const c = C[t.key] || { title: t.key, lines: [] }; return `<section class="ccard ${t.wrong ? "weak" : ""}"><h3>${c.title}<small>${t.nums.map((x) => x + "번").join(", ")}${t.wrong ? " · 다시 보기" : ""}</small></h3><ul>${c.lines.map((l) => `<li>${l}</li>`).join("")}</ul></section>`; }).join("")}</div>
    <div class="recap">${wrongTopics.length ? `<b>오늘 다시 볼 개념</b> · ${wrongTopics.join(", ")}. 빨간 테두리 카드를 한 번 더 읽고, 해당 문항의 해설을 다시 확인해 보세요.` : `<b>오늘은 모두 맞혔어요.</b> 카드의 공식을 손으로 한 번씩 써 보면 오래 기억에 남아요.`}</div>
  </article>
  <div class="finish">${r.finished ? `<div class="stamp"><b>완료</b><span>${fmtDot(new Date(r.finishedAt || Date.now()))}</span></div><p class="muted">오늘의 학습을 마무리했어요.</p>` : `<p class="muted">개념 정리를 다 읽었다면 오늘 학습을 마무리하세요.</p>`}
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn ghost" data-go="solve:${n}">← 해설로 돌아가기</button><button class="btn ghost" id="cpdf">개념 정리 PDF</button>
    ${r.finished ? `<button class="btn primary" data-go="home">달력으로</button>` : `<button class="btn gold lg" id="finishBtn">오늘의 학습 마무리 ✓</button>`}</div></div></main>`;
  bindTop(); typeset(document.getElementById("cpage"));
  document.getElementById("cpdf").onclick = () => elementToPdf(document.getElementById("cpage"), `mathson_day${dayKey(n)}_개념정리.pdf`);
  const fb = document.getElementById("finishBtn");
  if (fb) fb.onclick = async () => {
    r.finished = true; r.finishedAt = Date.now();
    try { await S.be.saveDay(dayKey(n), r); } catch { retrySave(dayKey(n)); }
    toast("오늘의 학습을 마무리했어요. 수고했어요!"); viewConcepts(n);
  };
}

/* ============================== 오답 노트 ============================== */
async function viewWrong() {
  $app.innerHTML = `${topbar()}<main class="wrap"><div class="center muted">오답을 모으는 중…</div></main>`; bindTop();
  const sel = S.wrongTopic || "";
  const byTopic = {}; Object.values(S.rec.days).forEach((d) => d.correct.forEach((ok, i) => { if (!ok && d.topics) byTopic[d.topics[i]] = (byTopic[d.topics[i]] || 0) + 1; }));
  const topics = Object.entries(byTopic).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (sel && !byTopic[sel]) { S.wrongTopic = ""; return viewWrong(); }
  // 전체: 최근 2주 / 주제 선택: 그 주제로 틀린 문제를 기간 상관없이 모두
  let entries = Object.entries(S.rec.days).filter(([, d]) => d.correct.some((x, i) => !x && (!sel || (d.topics && d.topics[i] === sel)))).sort((a, b) => b[0].localeCompare(a[0]));
  if (!sel) entries = entries.slice(0, 14);
  const items = []; let C = {};
  try {
    C = await loadConcepts().catch(() => ({})) || {};
    for (const [dk, d] of entries) {
      const probs = await loadDay(Number(dk));
      d.correct.forEach((ok, i) => { const p = probs[i]; if (!ok && p && (!sel || p.topic === sel)) items.push({ n: Number(dk), i, p, mine: d.answers[i] }); });
    }
  } catch { }
  const tname = (t) => (C[t] && C[t].title) || t;
  const chip = (t, label, c) => `<button class="chip tchip ${sel === t ? "on" : ""}" data-topic="${esc(t)}" aria-pressed="${sel === t}">${esc(label)}${c != null ? ` <b>${c}</b>` : ""}</button>`;
  const concept = sel && C[sel] ? `<section class="ccard weak wconcept"><h3>${C[sel].title}<small>개념 다시 보기</small></h3><ul>${C[sel].lines.map((l) => `<li>${l}</li>`).join("")}</ul></section>` : "";
  const units = [...new Set(items.map((it) => uname(it.p.unit)))].join(" · ");
  $app.querySelector("main").innerHTML = `<div class="hello"><div><h2>오답 노트</h2><div class="muted small">${sel ? `‘${esc(tname(sel))}’ 주제에서 틀린 문제를 모두 모았어요.` : "최근 2주 동안 틀린 문제예요. 주제를 누르면 그 주제만 모아 볼 수 있어요."}</div></div></div>
  <section class="card"><div class="card-h"><h3>자주 틀리는 주제</h3><span class="muted small">눌러서 주제별로 모아 보기</span></div>
    <div class="chips">${topics.length ? chip("", "전체 (최근 2주)") + topics.filter(([t], k) => S.allTopics || k < 10 || t === sel).map(([t, c]) => chip(t, tname(t), c)).join("") + (topics.length > 10 && !S.allTopics ? `<button class="chip more" id="moreTopics">+ ${topics.length - 10}개 더 보기</button>` : "") : `<span class="muted small">아직 틀린 문제가 없어요.</span>`}</div></section>
  ${sel ? `<div class="card-h wsum"><h3>${esc(tname(sel))} · ${items.length}문항</h3><span class="muted small">${esc(units)}</span></div>${concept}` : ""}
  <section class="card" id="wlist">${items.map((it, k) => `<div class="wrong-item"><div class="card-h" style="margin-bottom:6px"><b>${sel ? `${k + 1}. ` : ""}Day ${it.n} · ${it.i + 1}번</b><span class="muted small">${esc(uname(it.p.unit))} · ${esc(tname(it.p.topic))} · ${it.p.level}</span></div>
    <div class="sheet" style="box-shadow:none;padding:12px">${problemHTML(it.p, it.i, {})}<div class="sol" style="margin-top:6px"><div class="small">내 답: <b>${it.mine == null ? "없음" : it.p.type === "mc" ? CIRC[it.mine - 1] || it.mine : it.mine}</b> · 정답: <b>${it.p.type === "mc" ? CIRC[it.p.answer - 1] : it.p.answer}</b></div>
    <details class="sol"><summary>해설 보기</summary><div class="sol-body">${it.p.solution}</div></details></div></div>
    <button class="btn ghost sm" data-go="solve:${it.n}" style="margin-top:8px">Day ${it.n} 전체 보기</button></div>`).join("") || `<p class="muted">틀린 문제가 없어요. 멋져요!</p>`}</section>`;
  $app.querySelectorAll(".tchip").forEach((b) => (b.onclick = () => { S.wrongTopic = b.dataset.topic; viewWrong().then(() => { const w = document.querySelector(".wsum"); if (w) w.scrollIntoView({ block: "start" }); else window.scrollTo({ top: 0 }); }); }));
  const mt = document.getElementById("moreTopics"); if (mt) mt.onclick = () => { S.allTopics = true; viewWrong(); };
  typeset(document.getElementById("wlist")); const wc = document.querySelector(".wconcept"); if (wc) typeset(wc);
}

boot();
</script>
